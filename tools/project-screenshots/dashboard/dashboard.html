<!doctype html>
<!-- Mock of the executive dashboard for the portfolio. Invented numbers, no company data.
     Render at 1500x900: dashboard.html?lang=en  or  ?lang=es  (see tools/project-screenshots/README.md). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Executive dashboard</title>
<meta name="viewport" content="width=1500" />
<style>
  @font-face { font-family: 'Inter'; src: url('fonts/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  :root {
    --bg: #0c1110;
    --card: #141a19;
    --card2: #182120;
    --line: rgba(255, 255, 255, 0.07);
    --fg: #f3f7f6;
    --muted: #93a29f;
    --green: #20d3a4;
    --ok: #77ccb2;
    --bad: #ea6b6e;
    --watch: #f2c46d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1500px; height: 900px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--fg); position: relative; -webkit-font-smoothing: antialiased; }
  .page { position: absolute; inset: 0; padding: 36px 40px; display: flex; flex-direction: column; gap: 24px; }

  /* big soft circles (the rounded-circle motif) */
  .orb { position: absolute; border-radius: 50%; pointer-events: none; }
  .orb.a { width: 520px; height: 520px; right: -170px; top: -250px; border: 2px solid rgba(32, 211, 164, 0.16); }
  .orb.b { width: 360px; height: 360px; right: -90px; top: -190px; background: radial-gradient(circle at 40% 40%, rgba(32, 211, 164, 0.16), rgba(32, 211, 164, 0) 70%); }

  header { display: flex; align-items: center; justify-content: space-between; height: 64px; position: relative; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .mark { width: 52px; height: 52px; border-radius: 50%; background: rgba(32, 211, 164, 0.14); border: 2px solid rgba(32, 211, 164, 0.5); display: grid; place-items: center; }
  .mark i { display: block; width: 5px; border-radius: 3px; background: var(--green); }
  .mark .bars { display: flex; align-items: flex-end; gap: 4px; height: 20px; }
  h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .sub { margin-top: 4px; font-size: 16px; color: var(--muted); font-weight: 400; }
  .chips { display: flex; gap: 12px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 20px; border-radius: 999px; font-size: 16px; font-weight: 500; background: var(--card); border: 1px solid var(--line); }
  .chip.date svg { width: 18px; height: 18px; }
  .chip.sample { color: var(--muted); font-weight: 400; background: transparent; }

  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .tile { position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 26px 32px; height: 196px; }
  .tile .ring { position: absolute; right: -70px; bottom: -110px; width: 270px; height: 270px; border-radius: 50%; border: 2px solid rgba(32, 211, 164, 0.18); }
  .tile .ring::after { content: ''; position: absolute; inset: 44px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(32, 211, 164, 0.14), rgba(32, 211, 164, 0)); }
  .tile.warn .ring { border-color: rgba(242, 196, 109, 0.2); }
  .tile.warn .ring::after { background: radial-gradient(circle at 35% 35%, rgba(242, 196, 109, 0.12), rgba(242, 196, 109, 0)); }
  .tile .top { display: flex; align-items: center; justify-content: space-between; position: relative; }
  .label { font-size: 19px; font-weight: 500; color: var(--muted); }
  .verdict { display: inline-flex; align-items: center; gap: 10px; height: 38px; padding: 0 18px 0 14px; border-radius: 999px; font-size: 16px; font-weight: 600; }
  .verdict::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
  .verdict.ok { color: var(--ok); background: rgba(119, 204, 178, 0.14); }
  .verdict.watch { color: var(--watch); background: rgba(242, 196, 109, 0.14); }
  .value { margin-top: 12px; font-size: 68px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; position: relative; font-feature-settings: 'tnum'; }
  .meta { margin-top: 14px; font-size: 18px; color: var(--muted); display: flex; gap: 10px; align-items: center; position: relative; }
  .delta { font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  .delta.up { color: var(--ok); }
  .delta.down { color: var(--watch); }

  .main { display: grid; grid-template-columns: 1fr 440px; gap: 24px; flex: 1; min-height: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 28px 34px; position: relative; overflow: hidden; }
  .card h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .card .hint { margin-top: 4px; font-size: 16px; color: var(--muted); }
  .chart-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .legend { display: flex; gap: 22px; font-size: 15px; color: var(--muted); align-items: center; margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .legend i.band { border-radius: 5px; width: 22px; height: 14px; background: rgba(255,255,255,0.05); border: 1px dashed rgba(119,204,178,0.75); }
  svg text { font-family: 'Inter', sans-serif; }

  .side { display: flex; flex-direction: column; gap: 24px; }
  .unusual { display: flex; gap: 18px; margin-top: 20px; align-items: flex-start; }
  .dot { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; background: rgba(234, 107, 110, 0.14); border: 2px solid var(--bad); }
  .dot::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--bad); }
  .unusual strong { display: block; font-size: 20px; font-weight: 600; }
  .unusual p { margin: 6px 0 0; font-size: 16px; line-height: 1.5; color: var(--muted); }
  .unusual b { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
<div class="orb b"></div>
<div class="page">
  <header>
    <div class="brand">
      <div class="mark"><div class="bars"><i style="height:9px"></i><i style="height:16px"></i><i style="height:12px"></i></div></div>
      <div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
    </div>
    <div class="chips">
      <span class="chip sample" id="sample"></span>
      <span class="chip date">
        <svg viewBox="0 0 24 24" fill="none" stroke="#20d3a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span id="range"></span>
      </span>
    </div>
  </header>

  <section class="kpis">
    <div class="tile">
      <div class="ring"></div>
      <div class="top"><div class="label" id="k1l"></div><span class="verdict ok" id="k1v"></span></div>
      <div class="value" id="k1n"></div>
      <div class="meta"><span class="delta up" id="k1d"></span><span id="k1c"></span></div>
    </div>
    <div class="tile warn">
      <div class="ring"></div>
      <div class="top"><div class="label" id="k2l"></div><span class="verdict watch" id="k2v"></span></div>
      <div class="value" id="k2n"></div>
      <div class="meta"><span class="delta down" id="k2d"></span><span id="k2c"></span></div>
    </div>
  </section>

  <section class="main">
    <div class="card">
      <div class="chart-head">
        <div><h2 id="ct"></h2><div class="hint" id="ch"></div></div>
        <div class="legend">
          <span><i style="background:#20d3a4"></i><b style="font-weight:500" id="lg1"></b></span>
          <span><i style="background:#5b6967"></i><b style="font-weight:500" id="lg2"></b></span>
          <span><i class="band"></i><b style="font-weight:500" id="lg3"></b></span>
        </div>
      </div>
      <svg id="chart" width="880" height="360" viewBox="0 0 880 360" style="margin-top:14px"></svg>
    </div>
    <div class="side">
      <div class="card" style="height:214px">
        <h2 id="ut"></h2>
        <div class="unusual">
          <div class="dot"></div>
          <div><strong id="ud"></strong><p id="up"></p></div>
        </div>
      </div>
      <div class="card" style="flex:1">
        <h2 id="tt"></h2><div class="hint" id="th"></div>
        <svg id="spark" width="372" height="230" viewBox="0 0 372 230" style="margin-top:14px"></svg>
      </div>
    </div>
  </section>
</div>

<script>
const L = {
  en: {
    title: 'Executive dashboard', subtitle: 'Credit card transactions and active customers', sample: 'Sample data',
    range: 'Nov 2 – Nov 8', k1l: 'Transactions', k2l: 'Active customers', ok: 'Normal', watch: 'Watch',
    k1d: '+6.9%', k2d: '−2.7%', cmp: 'vs last week', wk: 'this week',
    ct: 'Week over week', ch: 'Monday to Sunday, full weeks only', lg: ['This week', 'Last week', 'Normal range'],
    days: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], flag: 'Unusual day',
    ut: 'Unusual days', ud: 'Friday', up: (v, lo, hi) => `Transactions reached <b>${v}</b>, above the normal range of ${lo} to ${hi}.`,
    tt: 'Transactions trend', th: 'Last 8 weeks', loc: 'en-US',
  },
  es: {
    title: 'Panel ejecutivo', subtitle: 'Transacciones con tarjeta de crédito y clientes activos', sample: 'Datos de ejemplo',
    range: '2 nov – 8 nov', k1l: 'Transacciones', k2l: 'Clientes activos', ok: 'Normal', watch: 'Vigilar',
    k1d: '+6,9%', k2d: '−2,7%', cmp: 'vs semana pasada', wk: 'esta semana',
    ct: 'Semana contra semana', ch: 'De lunes a domingo, solo semanas completas', lg: ['Esta semana', 'Semana pasada', 'Rango normal'],
    days: ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'], flag: 'Día inusual',
    ut: 'Días inusuales', ud: 'Viernes', up: (v, lo, hi) => `Las transacciones llegaron a <b>${v}</b>, sobre el rango normal de ${lo} a ${hi}.`,
    tt: 'Tendencia de transacciones', th: 'Últimas 8 semanas', loc: 'es-PY',
  },
};
const lang = new URLSearchParams(location.search).get('lang') === 'es' ? 'es' : 'en';
const t = L[lang];
document.documentElement.lang = lang;
const fmt = (n) => n.toLocaleString(t.loc);
const $ = (id) => document.getElementById(id);

// Invented numbers (thousands of transactions per day), Monday to Sunday.
const thisWeek = [120, 122, 124, 123, 158, 104, 90];
const lastWeek = [115, 118, 121, 120, 128, 99, 86];
const lo = [100, 102, 104, 104, 106, 82, 70];
const hi = [134, 136, 138, 138, 142, 122, 106];

$('title').textContent = t.title; $('subtitle').textContent = t.subtitle; $('sample').textContent = t.sample;
$('range').textContent = t.range;
$('k1l').textContent = t.k1l; $('k2l').textContent = t.k2l;
$('k1v').textContent = t.ok; $('k2v').textContent = t.watch;
$('k1n').textContent = fmt(thisWeek.reduce((a, b) => a + b) * 1000);
$('k2n').textContent = fmt(64200);
$('k1d').innerHTML = '▲ ' + t.k1d; $('k2d').innerHTML = '▼ ' + t.k2d;
$('k1c').textContent = t.cmp + ' · ' + t.wk; $('k2c').textContent = t.cmp + ' · ' + t.wk;
$('ct').textContent = t.ct; $('ch').textContent = t.ch;
$('lg1').textContent = t.lg[0]; $('lg2').textContent = t.lg[1]; $('lg3').textContent = t.lg[2];
$('ut').textContent = t.ut; $('ud').textContent = t.ud;
$('up').innerHTML = t.up(fmt(158000), fmt(112000), fmt(140000));
$('tt').textContent = t.tt; $('th').textContent = t.th;

// Bar chart
const svg = $('chart'); const NS = 'http://www.w3.org/2000/svg';
const el = (n, a, p = svg) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const X0 = 56, W = 880 - X0 - 4, TOP = 56, H = 250, MAX = 200, base = TOP + H;
const y = (v) => base - (v / MAX) * H;
for (const v of [0, 50, 100, 150, 200]) {
  el('line', { x1: X0, x2: 876, y1: y(v), y2: y(v), stroke: 'rgba(255,255,255,0.07)', 'stroke-width': 1 });
  el('text', { x: X0 - 14, y: y(v) + 5, 'text-anchor': 'end', fill: '#93a29f', 'font-size': 14 }).textContent = v === 0 ? '0' : v + 'K';
}
const gw = W / 7, bw = 34;
thisWeek.forEach((v, i) => {
  const cx = X0 + gw * i + gw / 2;
  const bar = (x, val, fill) => el('path', { d: `M${x},${base} V${y(val) + 9} a9,9 0 0 1 9,-9 h${bw - 18} a9,9 0 0 1 9,9 V${base} Z`, fill });
  bar(cx - bw - 4, lastWeek[i], '#5b6967');
  bar(cx + 4, v, i === 4 ? '#ea6b6e' : '#20d3a4');
  el('rect', { x: cx - 52, y: y(hi[i]), width: 104, height: y(lo[i]) - y(hi[i]), rx: 16, fill: 'rgba(255,255,255,0.05)', stroke: 'rgba(119,204,178,0.75)', 'stroke-dasharray': '6 6', 'stroke-width': 1.75 });
  el('text', { x: cx, y: base + 30, 'text-anchor': 'middle', fill: '#93a29f', 'font-size': 16, 'font-weight': 500 }).textContent = t.days[i];
});
// unusual-day marker on Friday
{
  const cx = X0 + gw * 4 + gw / 2 + 4 + bw / 2, cy = y(158) - 6;
  const w = t.flag.length * 8.6 + 52;
  const g = el('g', {});
  el('circle', { cx, cy: y(158) - 14, r: 7, fill: '#ea6b6e' }, g);
  el('circle', { cx, cy: y(158) - 14, r: 14, fill: 'none', stroke: '#ea6b6e', 'stroke-width': 2, opacity: 0.6 }, g);
  el('rect', { x: cx - w / 2, y: 4, width: w, height: 34, rx: 17, fill: 'rgba(234,107,110,0.16)', stroke: '#ea6b6e', 'stroke-width': 1.5 }, g);
  el('text', { x: cx, y: 26, 'text-anchor': 'middle', fill: '#ea6b6e', 'font-size': 15, 'font-weight': 600 }, g).textContent = t.flag;
  el('path', { d: `M${cx},38 V${y(158) - 30}`, stroke: '#ea6b6e', 'stroke-width': 1.5, opacity: 0.7 }, g);
}

// Sparkline: transactions, last 8 weeks (K per week), invented
{
  const s = $('spark'); const pts = [742, 756, 770, 749, 783, 787, 796, 841];
  const mn = 725, mx = 850, w = 372, h = 220, pad = 14;
  const px = (i) => pad + (i / 7) * (w - 2 * pad), py = (v) => 14 + (1 - (v - mn) / (mx - mn)) * (h - 60);
  const mk = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); s.appendChild(e); return e; };
  const defs = mk('defs', {});
  const gr = document.createElementNS(NS, 'linearGradient'); gr.setAttribute('id', 'fill'); gr.setAttribute('x1', 0); gr.setAttribute('x2', 0); gr.setAttribute('y1', 0); gr.setAttribute('y2', 1);
  gr.innerHTML = '<stop offset="0" stop-color="#20d3a4" stop-opacity="0.35"/><stop offset="1" stop-color="#20d3a4" stop-opacity="0"/>'; defs.appendChild(gr);
  const line = pts.map((v, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
  mk('path', { d: `${line} L${px(7)},${h} L${px(0)},${h} Z`, fill: 'url(#fill)' });
  mk('path', { d: line, fill: 'none', stroke: '#20d3a4', 'stroke-width': 3.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  mk('circle', { cx: px(7), cy: py(pts[7]), r: 11, fill: 'rgba(32,211,164,0.25)' });
  mk('circle', { cx: px(7), cy: py(pts[7]), r: 6, fill: '#20d3a4' });
}
</script>
</body>
</html>
